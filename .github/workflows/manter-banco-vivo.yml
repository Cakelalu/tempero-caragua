name: Manter Banco Aiven Ativo

on:
  schedule:
    # Roda a cada 8 minutos (O GitHub Actions recomenda intervalos de pelo menos 5-15 min)
    - cron: '*/8 * * * *'
  workflow_dispatch: # Permite que você execute manualmente pelo painel do GitHub para testar

jobs:
  ping-banco:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # Atualizado para o Node 24 recomendado pelo GitHub
        cache: 'npm' # Opcional: acelera o processo se tiver package-lock.json

    - name: Instalar Dependências
      run: npm install mysql2

    - name: Executar o Script de Ping
      env:
        AIVEN_URL: ${{ secrets.AIVEN_URL }} # Puxa a credencial que salvamos no passo 2
      run: node ping.js
